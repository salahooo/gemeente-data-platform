server {
  listen 8080;
  server_tokens off;
  autoindex off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /ready { proxy_pass http://api:8000/ready; proxy_set_header Host $host; }
  location = /health { proxy_pass http://api:8000/health; proxy_set_header Host $host; }
  location = /docs { proxy_pass http://api:8000/docs; proxy_set_header Host $host; }
  location = /openapi.json { proxy_pass http://api:8000/openapi.json; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
