name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Validate frontend with a synthetic public API origin
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run lint && npm run test && npm run build && npm audit --omit=dev
        working-directory: frontend
      - name: Reject local addresses and credential-shaped values in the production bundle
        run: |
          ! grep -RIE "localhost|127\.0\.0\.1|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@|password=|secret=" frontend/dist
      - run: docker compose --profile dashboard build dashboard

  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install locked CI environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.9.28"
          uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Run database-free tests
        run: uv run pytest -m "not integration"
      - name: Check repository whitespace
        run: git diff --check
      - name: Validate Render Blueprint YAML
        run: |
          uv run python -c "import yaml; data=yaml.safe_load(open('render.yaml', encoding='utf-8')); assert len(data['services']) == 2; print('render.yaml valid')"
      - name: Audit resolved dependencies
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          trap 'rm -f .ci-audit-requirements.txt' EXIT
          uv export --frozen --all-extras --no-emit-project --no-hashes --output-file .ci-audit-requirements.txt
          uv run pip-audit --strict -r .ci-audit-requirements.txt

  postgres-integration:
    name: PostgreSQL integration (Python 3.14)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_DB_INTEGRATION: "1"
      TEST_DATABASE_HOST: localhost
      TEST_DATABASE_PORT: "5434"
      TEST_DATABASE_NAME: gemeente_data_test
      TEST_DATABASE_USER: gemeente_app
      TEST_DATABASE_PASSWORD_FILE: secrets/app_password.txt
      DATABASE_HOST: localhost
      DATABASE_PORT: "5434"
      DATABASE_NAME: gemeente_data_test
      DATABASE_USER: gemeente_app
      DATABASE_PASSWORD_FILE: secrets/app_password.txt
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install locked CI environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.9.28"
          uv sync --frozen --all-extras
      - name: Create job-local database password files
        shell: bash
        run: |
          umask 077
          python -c "import secrets; print(secrets.token_urlsafe(32))" > secrets/app_password.txt
          python -c "import secrets; print(secrets.token_urlsafe(32))" > secrets/postgres_password.txt
          python -c "import secrets; print(secrets.token_urlsafe(32))" > secrets/api_password.txt
          # File-backed Compose secrets are bind-mounted; init scripts run as postgres.
          chmod 0444 secrets/app_password.txt secrets/postgres_password.txt secrets/api_password.txt
      - name: Build API image without publishing
        run: docker compose --profile api build api
      - name: Start isolated PostgreSQL test service
        run: docker compose --profile test up -d --wait --no-deps postgres_test
      - name: Show PostgreSQL test logs after startup failure
        if: failure()
        run: docker compose --profile test logs --no-color postgres_test || true
      - name: Run PostgreSQL integration tests
        run: uv run pytest -m integration
      - name: Stop isolated PostgreSQL test service
        if: always()
        run: docker compose --profile test stop postgres_test || true
      - name: Remove test container and job-local secrets
        if: always()
        shell: bash
        run: |
          docker compose --profile test rm -f -s postgres_test || true
          rm -f secrets/app_password.txt secrets/postgres_password.txt secrets/api_password.txt
