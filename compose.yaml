name: gemeente-data-platform

services:
  postgres:
    image: postgres:17.11-bookworm
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: gemeente_data
      POSTGRES_USER: gemeente_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    secrets:
      - postgres_password
      - app_password
      - api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemeente_bootstrap -d gemeente_data"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    shm_size: 128mb
    labels:
      com.gemeente-data-platform.component: postgres
      com.gemeente-data-platform.managed: "true"

  postgres_test:
    profiles: ["test"]
    image: postgres:17.11-bookworm
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: gemeente_data_test
      POSTGRES_USER: gemeente_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    secrets:
      - postgres_password
      - app_password
      - api_password
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemeente_bootstrap -d gemeente_data_test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    labels:
      com.gemeente-data-platform.component: postgres-test
      com.gemeente-data-platform.managed: "true"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["api", "dashboard"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: gemeente_data
      API_DATABASE_USER: gemeente_api
      API_DATABASE_PASSWORD_FILE: /run/secrets/api_password
      API_ALLOWED_ORIGINS: "${API_ALLOWED_ORIGINS:-}"
    secrets:
      - api_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    labels:
      com.gemeente-data-platform.component: api
      com.gemeente-data-platform.managed: "true"

  dashboard:
    build:
      context: ./frontend
    profiles: ["dashboard"]
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    labels:
      com.gemeente-data-platform.component: dashboard
      com.gemeente-data-platform.managed: "true"

volumes:
  postgres_data:
    labels:
      com.gemeente-data-platform.component: postgres-data
      com.gemeente-data-platform.managed: "true"

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_password:
    file: ./secrets/app_password.txt
  api_password:
    file: ./secrets/api_password.txt
