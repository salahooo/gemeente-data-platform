[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemeente-data-platform"
version = "0.1.0"
description = "Foundation for a Dutch municipal data portfolio project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "alembic",
    "filelock",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pip-audit>=2.9,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: vereist de geïsoleerde projecttestdatabase op poort 5434",
    "unit: snelle test zonder database",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"src/gemeente_data_platform/check_database.py" = ["E501"]
"src/gemeente_data_platform/database_loader.py" = ["E501"]
"tests/test_database_integration.py" = ["E501"]
"src/gemeente_data_platform/api.py" = ["E501"]
"src/gemeente_data_platform/api_repository.py" = ["E501"]
"tests/test_api.py" = ["E501"]
"tests/test_api_integration.py" = ["E501"]
